    <script>
      /* Theme bootstrap — runs before any paint so there is no light->dark flash.
         Default is light for existing users; only a stored preference switches it. */
      (function () {
        try {
          var t = localStorage.getItem('vhc_pos_theme');
          document.documentElement.setAttribute('data-theme', t === 'dark' ? 'dark' : 'light');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
